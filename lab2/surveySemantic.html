<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Survey Form</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 40px;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
        }
        main {
            max-width: 650px;
        }
        header img {
            width: 100px;
            display: block;
            margin-bottom: 10px;
        }
        h2,
        legend {
            font-weight: bold;
            color: #007B7F;
        }
        label.form-label,
        label.col-form-label {
            font-weight: bold;
        }
        .form-check-label {
            font-weight: normal;
        }
        .btn-submit {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <img src="favicon.png" alt="Logo">
            <h2>Survey</h2>
            <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>
        </header>
        <section>
            <h4 class="fw-bold" style="color:#007B7F;">Your information:</h4>
            <form>
                <fieldset class="mb-3 d-flex align-items-center">
                    <label for="fname" class="col-form-label me-3" style="width: 150px;">First Name</label>
                    <input type="text" id="fname" class="form-control" required>
                </fieldset>

                <fieldset class="mb-3 d-flex align-items-center">
                    <label for="lname" class="col-form-label me-3" style="width: 150px;">Last Name</label>
                    <input type="text" id="lname" class="form-control" required>
                </fieldset>

                <fieldset class="mb-3 d-flex align-items-center">
                    <label for="email" class="col-form-label me-3" style="width: 150px;">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </fieldset>

                <fieldset class="mb-3 d-flex align-items-center">
                    <label for="dob" class="col-form-label me-3" style="width: 150px;">Date of Birth</label>
                    <input type="date" id="dob" class="form-control" required>
                </fieldset>
                <fieldset class="mb-4">
                    <legend class="fw-bold h4" style="color:#007B7F;">How did you hear about us?</legend>

                    <section class="d-flex flex-wrap gap-4">
                        <label class="form-check">
                            <input class="form-check-input" type="radio" name="source" id="search" checked>
                            Search engine
                        </label>

                        <label class="form-check">
                            <input class="form-check-input" type="radio" name="source" id="word">
                            Word of mouth
                        </label>

                        <label class="form-check">
                            <input class="form-check-input" type="radio" name="source" id="social">
                            Social Media
                        </label>

                        <label class="form-check">
                            <input class="form-check-input" type="radio" name="source" id="other">
                            Other
                        </label>
                    </section>
                </fieldset>
                <fieldset class="mb-4">
                    <legend class="fw-bold h4" style="color:#007B7F;">
                        Would you like to receive announcements about new CDs and special offers?
                    </legend>

                    <section>
                        <label class="form-check">
                            <input class="form-check-input" type="checkbox" id="offers">
                            YES, I'd like that.
                        </label>

                        <label class="form-check mt-2">
                            <input class="form-check-input" type="checkbox" id="emails">
                            YES, please send me email announcements.
                        </label>
                    </section>
                </fieldset>
                <fieldset class="mb-3 d-flex align-items-center">
                    <label for="contactMethod" class="form-check-label me-3" style="width: 180px;">
                        Please contact me by:
                    </label>

                    <select class="form-select" id="contactMethod" style="max-width: 200px;">
                        <option>Email or postal mail</option>
                        <option>Email only</option>
                        <option>Postal mail only</option>
                    </select>
                </fieldset>
                <button type="submit" class="btn btn-primary btn-submit">Submit</button>
            </form>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
